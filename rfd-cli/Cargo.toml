[package]
name = "rfd-cli"
version = { workspace = true }
edition = { workspace = true }

[features]
local-dev = []

[dependencies]
anyhow = { workspace = true }
chrono = { workspace = true }
clap = { workspace = true }
config = { workspace = true }
dirs = { workspace = true }
progenitor-client = { workspace = true }
# progenitor 0.14 / v-cli-sdk target reqwest 0.13.
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "rustls"] }
rfd-sdk = { path = "../rfd-sdk" }
schemars = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
toml = { workspace = true }
uuid = { workspace = true, features = ["serde", "v4"] }
v-cli-sdk = { workspace = true }

[build-dependencies]
build-info = { path = "../build-info" }

[package.metadata.dist]
targets = ["x86_64-unknown-linux-gnu", "aarch64-apple-darwin", "x86_64-apple-darwin"]
