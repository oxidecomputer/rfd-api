[workspace]
members = [
  "build-info",
  "parse-rfd",
  "rfd-api",
  "rfd-cli",
  "rfd-data",
  "rfd-github",
  "rfd-model",
  "rfd-processor",
  "rfd-sdk",
  "trace-request",
  "xtask"
]
resolver = "2"

[workspace.package]
version = "0.15.5"
edition = "2024"

[workspace.dependencies]
anyhow = "1.0.102"
async-bb8-diesel = "0.3.0"
async-trait = "0.1.91"
base64 = "0.22"
chrono = "0.4.44"
clap = { version = "4.6.4", features = ["derive", "string", "env"] }
config = { version = "0.15.25", features = ["toml"] }
diesel = { version = "2.3.9", features = ["postgres"] }
diesel_migrations = { version = "2.3.2" }
dirs = "6.0.0"
dropshot = "0.17"
dropshot-verified-body = { git = "https://github.com/oxidecomputer/dropshot-verified-body", tag = "v0.2.1" }
futures = "0.3.33"
google-drive3 = { version = "7.0.0", default-features = false, features = ["yup-oauth2-service-account", "aws-lc-rs"] }
google-storage1 = "7.0.0"
hex = "0.4.3"
hmac = "0.13.0"
http = "1.4.2"
jsonwebtoken = { version = "10.2", features = ["aws_lc_rs"] }
meilisearch-sdk = "0.33.0"
md-5 = "0.11.0"
mime_guess = "2.0.5"
minijinja = { version = "2.19", features = ["loader"] }
mockall = "0.14"
newline-converter = "0.3.0"
newtype-uuid = { version = "1.3.2", features = ["schemars08", "serde", "v4"] }
octorust = { git = "https://github.com/oxidecomputer/third-party-api-clients", tag = "v0.11.0-rc.0" }
partial-struct = { git = "https://github.com/oxidecomputer/partial-struct" }
progenitor = { version = "0.14" }
progenitor-client = { version = "0.14" }
regex = "1.12.3"
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "rustls"] }
reqwest-middleware = "0.5"
reqwest-retry = "0.9"
reqwest-tracing = "0.7"
resend-rs = { version = "0.25.1", default-features = false, features = ["rustls-tls"] }
rsa = "0.9.10"
rustfmt-wrapper = "0.2.1"
rustls = "0.23"
schemars = "0.8.22" # see: https://github.com/oxidecomputer/dropshot/issues/1375
secrecy = "0.10.3"
semver = "1.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
similar = "3.1.0"
slog = "2.8.2"
slog-async = "2.8.0"
strum = { version = "0.28.0", features = ["derive"] }
tap = "1.0.1"
thiserror = "2"
tokio = { version = "1.52.3", default-features = false, features = ["rt-multi-thread", "macros"] }
toml = "1.1.2"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-slog = { git = "https://github.com/oxidecomputer/tracing-slog", default-features = false }
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
uuid = { version = "1.23.1", features = ["serde", "v4"] }
v-api = { git = "https://github.com/oxidecomputer/v-api", tag = "v0.4.10", default-features = false }
v-cli-sdk = { git = "https://github.com/oxidecomputer/v-api", tag = "v0.4.10" }
v-model = { git = "https://github.com/oxidecomputer/v-api", tag = "v0.4.10" }
v-api-permission-derive = { git = "https://github.com/oxidecomputer/v-api", tag = "v0.4.10" }
yup-oauth2 = { version = "12.1.2", default-features = false, features = ["hyper-rustls", "service-account", "aws-lc-rs"] }

# Config for 'cargo dist'
[workspace.metadata.dist]
# The preferred cargo-dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.12.2"
# CI backends to support
ci = ["github"]
# The installers to generate for each app
installers = []
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]
# Publish jobs to run in CI
pr-run-mode = "skip"

# The profile that 'cargo dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

