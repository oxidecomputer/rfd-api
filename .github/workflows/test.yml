name: Test

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}-${{ github.ref_name == 'main' && github.sha || 'anysha' }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install PDF comparison tool
        run: |
          sudo apt-get update
          sudo apt-get install -y diff-pdf-wx fontconfig
      - uses: ruby/setup-ruby@6e5d382445ae5590b7449d8b3bc8cb1c2c27f617 # v1.3.7
        with:
          working-directory: rfd-processor
          bundler-cache: true
      - name: Install PDF toolchain
        shell: bash
        working-directory: rfd-processor
        run: |
          bundle config set bin .bundle/bin
          bundle binstubs asciidoctor asciidoctor-pdf
          npm ci
          npm run install:chrome
          echo "$PWD/.bundle/bin" >> "$GITHUB_PATH"
          echo "$PWD/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Report versions
        working-directory: rfd-processor
        run: |
          asciidoctor --version
          asciidoctor-pdf --version
          mmdc --version
          node --version
          npm --version
          node -e 'const puppeteer = require("puppeteer"); puppeteer.executablePath().then(console.log)'
          "$(node -e 'const puppeteer = require("puppeteer"); puppeteer.executablePath().then((path) => process.stdout.write(path))')" --version
          fc-match sans-serif
          fc-match Arial
          fc-match Verdana
          fc-match "Trebuchet MS"
      - run: |
          rustup toolchain install
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - run: |
          cargo test
        env:
          TEST_DATABASE: postgres://test:test@localhost
          RUST_LOG: v=trace,rfd=trace
      - name: Upload rendered PDF
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rfd-processor-example-pdf-artifacts
          path: |
            rfd-processor/tests/content/example-rendered.pdf
            rfd-processor/tests/content/example-diff.pdf
            rfd-processor/tests/content/example-mermaid-rendered.png
          if-no-files-found: ignore

  generate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - run: |
          rustup toolchain install
          rustup toolchain install nightly --component rustfmt
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: Install Dprint
        run: |
          mkdir -p "$HOME/.dprint/bin"
          curl -fsSL \
            "https://github.com/dprint/dprint/releases/download/${DPRINT_VERSION}/${DPRINT_ASSET}" \
            > "$HOME/.dprint/bin/${DPRINT_ASSET}"
          cd "$HOME/.dprint/bin"
          echo "${DPRINT_HASH}  ${DPRINT_ASSET}" | sha256sum --check
          unzip "${DPRINT_ASSET}"
          rm "${DPRINT_ASSET}"
          echo "/home/runner/.dprint/bin" >> "$GITHUB_PATH"
        env:
          DPRINT_VERSION: 0.53.0
          DPRINT_HASH: 987185f5f0db6205e5bca88aaab04a7b29bc18bf7a8c1a84f56eef08c9730df0
          DPRINT_ASSET: dprint-x86_64-unknown-linux-gnu.zip

      - name: Verify SDK Generation
        run: |
          cargo xtask generate
          GENERATED="rfd-api-spec.json rfd-sdk/src/generated/ rfd-cli/src/generated/ rfd-ts/"
          if ! git diff --quiet -- "$GENERATED"; then
            git diff -- "$GENERATED"
            echo "Found changed files after generating SDKs:"
            git status -s -- "$GENERATED"
            echo "To fix, regenerate with, commit the changes from running:"
            echo "  cargo xtask generate"
            exit 1
          fi
