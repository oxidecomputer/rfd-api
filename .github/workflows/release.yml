name: Release CLI

on:
  push:
    tags:
      - '**[0-9]+.[0-9]+.[0-9]+*'
  pull_request:
    types: [labeled, synchronize]

permissions:
  contents: read

jobs:
  # Builds run with a read-only token. Only the publish job below, on Linux,
  # gets write access, so a compromised build runner can't directly modify the
  # repo or its releases. It can still supply malicious release binaries.
  build:
    if: >-
      github.event_name == 'push' ||
      github.event.label.name == 'release-test' ||
      contains(github.event.pull_request.labels.*.name, 'release-test')
    strategy:
      matrix:
        include:
          - os: ubuntu-24.04
            binary: rfd-cli
            artifact: rfd-cli-x86_64-unknown-linux-gnu
          - os: macos-15
            binary: rfd-cli
            artifact: rfd-cli-aarch64-apple-darwin
          - os: macos-15-intel
            binary: rfd-cli
            artifact: rfd-cli-x86_64-apple-darwin
          - os: windows-2025
            binary: rfd-cli.exe
            artifact: rfd-cli-x86_64-pc-windows-msvc.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - run: |
          rustup toolchain install

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Build Release Binary
        run: |
          cargo build --release --package rfd-cli

      - name: Rename Binary
        shell: bash
        run: |
          mv "target/release/${{ matrix.binary }}" "target/release/${{ matrix.artifact }}"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.artifact }}
          path: target/release/${{ matrix.artifact }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Determine release tag
        id: tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "value=v0.0.0-pre+${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true

      - uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1.21.0
        with:
          allowUpdates: true
          draft: ${{ github.event_name == 'pull_request' }}
          tag: ${{ steps.tag.outputs.value }}
          artifacts: 'dist/*'
